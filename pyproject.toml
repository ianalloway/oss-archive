[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odds-drift-watch"
version = "0.1.0"
description = "Poll sportsbook lines (The Odds API, BYOK), detect sharp moves, alert Discord or webhooks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ian Alloway" }]
keywords = ["odds", "alerts", "sports-betting", "fastapi", "saas"]

dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.3", "pytest-asyncio>=0.23.0"]

[project.scripts]
odds-drift-watch = "odds_drift_watch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["odds_drift_watch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

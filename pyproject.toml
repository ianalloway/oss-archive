[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odds-cli"
version = "0.1.0"
description = "Check live sports odds from your terminal"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "odds-cli contributors"},
]
keywords = ["sports", "odds", "betting", "cli", "terminal", "sportsbook", "kelly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "types-requests",
]

[project.scripts]
odds = "odds_cli.main:main"

[project.urls]
Homepage = "https://github.com/ianalloway/odds-cli"
Repository = "https://github.com/ianalloway/odds-cli"
"Bug Tracker" = "https://github.com/ianalloway/odds-cli/issues"

[tool.setuptools.packages.find]
include = ["odds_cli*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "build", "dist"]
